on:
  - push
  - workflow_dispatch

# Tags published per build (by branch; a pushed git tag is treated as "any other branch"):
#   main:                      amd64, arm64, latest; canary*; ubuntu-<RELEASE>*
#   a branch named ubuntu-<RELEASE> (RELEASE per the Dockerfile): ubuntu-<RELEASE>* only, so the image for an
#                              Ubuntu release other than main's can be built and tested without touching canary
#   any other branch named ubuntu-*: the build fails fast, since it would otherwise publish nothing
#   any other branch:          canary*; <branch>* (with / replaced by -), so a dependent can pin to one branch's
#                              image, e.g. cs50/cli:python-3.15, without canary moving under it. The build fails
#                              fast if that name is not a valid Docker tag, or is one main publishes (latest,
#                              amd64, arm64, canary*, ubuntu-*), which a branch build must never overwrite
# where * means the -amd64 and -arm64 tags plus a multi-arch manifest.

jobs:
  build-amd64:
    runs-on: ubuntu-2604-64-cores-amd
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Build for linux/amd64
        uses: docker/build-push-action@v7
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILDARCH=amd64
          load: true
          platforms: linux/amd64
          tags: |
            cs50/cli:amd64
            cs50/cli:canary-amd64

      - name: Check out tests
        uses: actions/checkout@v7

      - name: Determine Ubuntu release
        id: release
        run: |
          release=$(sed --quiet 's/^ARG RELEASE=//p' Dockerfile)
          [[ "$release" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || { echo "::error::could not read ARG RELEASE from Dockerfile (got '$release')"; exit 1; }
          if [[ "$GITHUB_REF" == refs/heads/ubuntu-* && "$GITHUB_REF" != "refs/heads/ubuntu-$release" ]]; then
              echo "::error::branch $GITHUB_REF_NAME does not match Dockerfile ARG RELEASE=$release; nothing would be published"
              exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

          # The <branch> tags, for any ref other than main and ubuntu-<RELEASE>: the name must be a valid
          # Docker tag once / becomes - (with room for the -amd64 and -arm64 suffixes), and must not be a
          # tag the main build publishes, or a branch named latest would replace the production image
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/heads/ubuntu-* ]]; then
              tag="${GITHUB_REF_NAME//\//-}"
              [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ ]] || { echo "::error::$GITHUB_REF_NAME cannot be published as Docker tag cs50/cli:$tag"; exit 1; }
              [[ "$tag" =~ ^(latest|amd64|arm64|main|canary(-.*)?|ubuntu-.*)$ ]] && { echo "::error::$GITHUB_REF_NAME would publish cs50/cli:$tag, a tag reserved for the main build"; exit 1; }
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke-test linux/amd64 build
        run: |
          bash tests/smoke.sh cs50/cli:canary-amd64

      - name: Push linux/amd64 build to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker push cs50/cli:amd64

      - name: Push linux/amd64 build to Docker Hub (canary)
        if: ${{ !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        run: |
          docker push cs50/cli:canary-amd64

      - name: Push linux/amd64 build to Docker Hub (${{ steps.release.outputs.tag }})
        if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker tag cs50/cli:canary-amd64 cs50/cli:"$TAG"-amd64
          docker push cs50/cli:"$TAG"-amd64

      - name: Push linux/amd64 build to Docker Hub (ubuntu-${{ steps.release.outputs.release }})
        if: ${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/ubuntu-{0}', steps.release.outputs.release) }}
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          docker tag cs50/cli:amd64 cs50/cli:ubuntu-"$RELEASE"-amd64
          docker push cs50/cli:ubuntu-"$RELEASE"-amd64

  build-arm64:
    runs-on: ubuntu-2604-64-cores-arm
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Build for linux/arm64
        uses: docker/build-push-action@v7
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILDARCH=arm64
          load: true
          platforms: linux/arm64
          tags: |
            cs50/cli:arm64
            cs50/cli:canary-arm64

      - name: Check out tests
        uses: actions/checkout@v7

      - name: Determine Ubuntu release
        id: release
        run: |
          release=$(sed --quiet 's/^ARG RELEASE=//p' Dockerfile)
          [[ "$release" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || { echo "::error::could not read ARG RELEASE from Dockerfile (got '$release')"; exit 1; }
          if [[ "$GITHUB_REF" == refs/heads/ubuntu-* && "$GITHUB_REF" != "refs/heads/ubuntu-$release" ]]; then
              echo "::error::branch $GITHUB_REF_NAME does not match Dockerfile ARG RELEASE=$release; nothing would be published"
              exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

          # As in build-amd64
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/heads/ubuntu-* ]]; then
              tag="${GITHUB_REF_NAME//\//-}"
              [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ ]] || { echo "::error::$GITHUB_REF_NAME cannot be published as Docker tag cs50/cli:$tag"; exit 1; }
              [[ "$tag" =~ ^(latest|amd64|arm64|main|canary(-.*)?|ubuntu-.*)$ ]] && { echo "::error::$GITHUB_REF_NAME would publish cs50/cli:$tag, a tag reserved for the main build"; exit 1; }
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke-test linux/arm64 build
        run: |
          bash tests/smoke.sh cs50/cli:canary-arm64

      - name: Push linux/arm64 build to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker push cs50/cli:arm64

      - name: Push linux/arm64 build to Docker Hub (canary)
        if: ${{ !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        run: |
          docker push cs50/cli:canary-arm64

      - name: Push linux/arm64 build to Docker Hub (${{ steps.release.outputs.tag }})
        if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker tag cs50/cli:canary-arm64 cs50/cli:"$TAG"-arm64
          docker push cs50/cli:"$TAG"-arm64

      - name: Push linux/arm64 build to Docker Hub (ubuntu-${{ steps.release.outputs.release }})
        if: ${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/ubuntu-{0}', steps.release.outputs.release) }}
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          docker tag cs50/cli:arm64 cs50/cli:ubuntu-"$RELEASE"-arm64
          docker push cs50/cli:ubuntu-"$RELEASE"-arm64

  finalize:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ needs.build-amd64.outputs.release }}
      TAG: ${{ needs.build-amd64.outputs.tag }}
    steps:
      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest and push to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker manifest create cs50/cli:latest \
          --amend cs50/cli:amd64 \
          --amend cs50/cli:arm64
          docker manifest push cs50/cli:latest

      - name: Create multi-arch manifest and push to Docker Hub (canary)
        if: ${{ !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        run: |
          docker manifest create cs50/cli:canary \
          --amend cs50/cli:canary-amd64 \
          --amend cs50/cli:canary-arm64
          docker manifest push cs50/cli:canary

      - name: Create multi-arch manifest and push to Docker Hub (${{ env.TAG }})
        if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/ubuntu-') }}
        run: |
          docker manifest create cs50/cli:"$TAG" \
          --amend cs50/cli:"$TAG"-amd64 \
          --amend cs50/cli:"$TAG"-arm64
          docker manifest push cs50/cli:"$TAG"

      - name: Create multi-arch manifest and push to Docker Hub (ubuntu-${{ env.RELEASE }})
        if: ${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/ubuntu-{0}', needs.build-amd64.outputs.release) }}
        run: |
          docker manifest create cs50/cli:ubuntu-"$RELEASE" \
          --amend cs50/cli:ubuntu-"$RELEASE"-amd64 \
          --amend cs50/cli:ubuntu-"$RELEASE"-arm64
          docker manifest push cs50/cli:ubuntu-"$RELEASE"

      # Rebuild dependents on the branch of the same name, if they have one
      - name: Re-deploy dependents
        if: ${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/ubuntu-{0}', needs.build-amd64.outputs.release) }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPLOY50_PAT }}
          script: |
            const dependents = [
                'server'
            ];
            for (let dependent of dependents) {
                try {
                  await github.rest.repos.getBranch({ owner: 'cs50', repo: dependent, branch: context.ref.replace('refs/heads/', '') });
                } catch (e) {
                  if (e.status === 404) {
                    core.info(`cs50/${dependent} has no ${context.ref.replace('refs/heads/', '')} branch; not dispatching`);
                    continue;
                  }
                  throw e;
                }
                await github.rest.actions.createWorkflowDispatch({
                  owner: 'cs50',
                  repo: dependent,
                  workflow_id: 'main.yml',
                  ref: context.ref.replace('refs/heads/', '')
                });
            }
